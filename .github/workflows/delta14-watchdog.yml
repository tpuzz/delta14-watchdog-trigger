name: Delta14 watchdog - quota saver

on:
  push:
    branches: [main]
    paths:
      - "watchdog/start.signal"
      - "watchdog/recovery.signal"
      - "watchdog/supervisor.py"
      - "watchdog/test_supervisor.py"
      - "watchdog/oneshot.py"
      - "watchdog/test_oneshot.py"
      - ".github/workflows/delta14-watchdog.yml"
  schedule:
    # Coarse backstop only. Silent failures are also checked by the existing
    # ChatGPT hourly watchdog. There is no continuous private CI runner.
    - cron: "37 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: delta14-watchdog
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Regression tests (no network or mutations)
        run: python3 -m unittest discover -s watchdog -p 'test_*.py' -v
      - name: Durable one-shot recovery check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 watchdog/oneshot.py
