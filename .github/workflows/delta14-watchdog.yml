name: Delta14 watchdog

on:
  push:
    branches: [main]
    paths:
      - "watchdog/start.signal"
      - "watchdog/supervisor.py"
      - "watchdog/test_supervisor.py"
      - ".github/workflows/delta14-watchdog.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: delta14-watchdog
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Regression tests (no network or mutations)
        run: python3 -m unittest discover -s watchdog -p 'test_supervisor.py' -v
      - name: Supervise coherent heartbeat and ownership snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 watchdog/supervisor.py
